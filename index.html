<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071126">
  <title>Flores Daniela · Jardín nocturno</title>
  <style>
    :root { color-scheme: dark; --ink:#071126; --gold:#ffd85d; --cream:#fff3b0; --leaf:#3b775e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; font-family:Georgia, 'Times New Roman', serif; background:#071126; color:#fff9d8; }
    .garden { position:relative; min-height:100svh; overflow:hidden; isolation:isolate; background:radial-gradient(ellipse at 70% 17%, rgba(140,174,234,.24), transparent 20%), linear-gradient(#05091d 0%,#0b1a42 51%,#14314a 74%,#081e2a 100%); }
    .stars, .stars::before, .stars::after { position:absolute; inset:0; content:''; background-image:radial-gradient(#fff 1px,transparent 1.7px),radial-gradient(#d9e9ff 1px,transparent 1.7px),radial-gradient(#fff4b0 1px,transparent 1.7px); background-size:104px 93px,137px 109px,173px 131px; background-position:0 0,47px 22px,99px 71px; opacity:.75; animation:twinkle 6s ease-in-out infinite alternate; }
    .stars::before { transform:translateY(18px); opacity:.42; animation-delay:-2s; } .stars::after { transform:translateY(-12px); opacity:.28; animation-delay:-4s; }
    @keyframes twinkle { to { opacity:.35; } }
    .moon { position:absolute; top:8%; right:14%; width:clamp(90px,12vw,164px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 34% 30%,#fffde2 0 7%,#eef3ff 41%,#c8d8fb 70%,#9fb9e7); box-shadow:0 0 42px 13px rgba(205,222,255,.34),inset -18px -12px 20px rgba(113,141,190,.2); }
    .moon::after { content:''; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 64% 32%,rgba(132,158,204,.17) 0 8%,transparent 9%),radial-gradient(circle at 38% 68%,rgba(132,158,204,.13) 0 11%,transparent 12%); }
    .hill { position:absolute; bottom:16%; width:75%; height:25%; border-radius:50% 50% 0 0; background:linear-gradient(180deg,#1e4551,#0b2233); filter:drop-shadow(0 -12px 24px #051222); } .hill.one { left:-24%; } .hill.two { right:-28%; height:30%; background:linear-gradient(180deg,#28475d,#0b1d31); }
    .copy { position:relative; z-index:5; display:grid; place-items:center; min-height:48svh; padding:3rem 1.5rem 0; text-align:center; text-shadow:0 3px 14px rgba(0,0,0,.7); }
    .copy p { margin:0 0 .75rem; color:#ffe999; font:600 clamp(.68rem,1.5vw,.9rem)/1.2 system-ui,sans-serif; letter-spacing:.27em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.7rem,8vw,6.5rem); font-weight:400; letter-spacing:.04em; background:linear-gradient(110deg,#fff9cf,#ffd550 48%,#fff2a7); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .copy .subtitle { max-width:36rem; margin:1rem auto 0; color:#e1ecff; font:400 clamp(1rem,2vw,1.22rem)/1.6 system-ui,sans-serif; letter-spacing:.01em; }
    .hint { position:absolute; z-index:20; left:50%; bottom:23%; transform:translateX(-50%); border:1px solid rgba(255,225,114,.38); border-radius:999px; padding:.7rem 1.15rem; backdrop-filter:blur(8px); background:rgba(7,16,45,.46); color:#fff1af; font:500 .82rem/1 system-ui,sans-serif; animation:lift 2.4s ease-in-out infinite; cursor:pointer; }
    @keyframes lift { 50% { transform:translateX(-50%) translateY(-7px); } }
    .field { position:absolute; z-index:10; inset:auto 0 -6px; height:min(47vh,385px); pointer-events:none; }
    .flower { --x:50%; --s:1; --r:0deg; position:absolute; left:var(--x); bottom:0; width:92px; height:270px; transform:translateX(-50%) scale(var(--s)) rotate(var(--r)); transform-origin:50% 100%; filter:drop-shadow(0 16px 12px rgba(0,0,0,.45)); animation:sway 5s ease-in-out infinite alternate; }
    @keyframes sway { to { transform:translateX(-50%) scale(var(--s)) rotate(calc(var(--r) + 3deg)); } }
    .stem { position:absolute; left:45px; bottom:0; width:7px; height:202px; border-radius:100% 0; background:linear-gradient(90deg,#112a22,#5b966c,#183328); transform:rotate(-3deg); }
    .stem::before,.stem::after { content:''; position:absolute; width:54px; height:27px; border-radius:100% 0 100% 0; background:linear-gradient(145deg,#78a36c,#1c4537 72%); box-shadow:inset 5px 3px 6px rgba(224,255,184,.17); }
    .stem::before { top:78px; right:0; transform:rotate(-27deg); } .stem::after { top:124px; left:-36px; transform:scaleX(-1) rotate(-24deg); }
    .bloom { position:absolute; top:2px; left:50%; width:88px; height:76px; transform:translateX(-50%); border-radius:53% 47% 49% 51% / 48% 47% 53% 52%; background:radial-gradient(ellipse at 52% 54%,#6e4216 0 8%,#d58d18 9% 15%,#ffdf60 16% 25%,transparent 26%),radial-gradient(ellipse at 24% 60%,#e2a31e 0 22%,#ffda55 48%,transparent 49%),radial-gradient(ellipse at 73% 60%,#d89016 0 22%,#ffec7d 48%,transparent 49%),radial-gradient(ellipse at 50% 23%,#fff5ac 0 28%,#f4bd31 59%,#a96311 100%); box-shadow:inset -10px -13px 15px rgba(103,54,4,.25),inset 8px 6px 10px rgba(255,255,223,.45),0 0 18px rgba(255,211,77,.2); }
    .bloom::before,.bloom::after { content:''; position:absolute; inset:12px -7px 4px; border:10px solid rgba(255,227,105,.9); border-left-color:rgba(239,166,21,.76); border-right-color:rgba(255,249,181,.92); border-radius:50%; transform:rotate(25deg); } .bloom::after { inset:23px 9px 10px; border-width:7px; transform:rotate(-23deg); }
    .hydrangea .bloom { width:102px; height:92px; border-radius:49% 51% 50% 50%; background-color:#d89a1e; background-image:radial-gradient(circle at 18% 27%,#fff6b0 0 9%,#dfa026 10% 16%,transparent 17%),radial-gradient(circle at 44% 17%,#fff0a0 0 10%,#cf8616 11% 17%,transparent 18%),radial-gradient(circle at 73% 24%,#fff6b6 0 9%,#e0a124 10% 16%,transparent 17%),radial-gradient(circle at 27% 54%,#fff4a8 0 10%,#d78e16 11% 17%,transparent 18%),radial-gradient(circle at 57% 48%,#fff8bd 0 11%,#e09d1e 12% 18%,transparent 19%),radial-gradient(circle at 83% 55%,#ffea80 0 10%,#c98215 11% 17%,transparent 18%),radial-gradient(circle at 42% 78%,#fff3a1 0 10%,#d88e17 11% 17%,transparent 18%),radial-gradient(circle at 71% 77%,#ffeb82 0 10%,#cc8618 11% 17%,transparent 18%),radial-gradient(ellipse,#f6c33e,#a56812); }
    .hydrangea .bloom::before,.hydrangea .bloom::after { display:none; }
    .f1{--x:3%;--s:1.32;--r:-9deg}.f2{--x:10%;--s:1.05;--r:8deg}.f3{--x:18%;--s:.83;--r:-5deg}.f4{--x:25%;--s:1.22;--r:7deg}.f5{--x:33%;--s:.93;--r:-6deg}.f6{--x:40%;--s:1.12;--r:5deg}.f7{--x:52%;--s:.82;--r:-5deg}.f8{--x:60%;--s:1.13;--r:6deg}.f9{--x:68%;--s:.9;--r:-6deg}.f10{--x:75%;--s:1.25;--r:7deg}.f11{--x:83%;--s:.94;--r:-5deg}.f12{--x:91%;--s:1.34;--r:8deg}.f13{--x:98%;--s:1.12;--r:-7deg}
    .flower:nth-child(3n){animation-delay:-1.8s}.flower:nth-child(4n){animation-delay:-3.4s}
    .glow { position:absolute; z-index:8; inset:auto 0 14%; height:30%; background:radial-gradient(ellipse at 50% 100%,rgba(255,213,76,.17),transparent 64%); mix-blend-mode:screen; }
    @media (max-width:600px){ .moon{right:8%;top:7%}.copy{min-height:44svh;padding-top:1.5rem}.hint{bottom:27%}.field{transform:scale(1.05);transform-origin:bottom center} }
  </style>
</head>
<body>
  <main class="garden">
    <div class="stars"></div><div class="moon"></div><div class="hill one"></div><div class="hill two"></div>
    <section class="copy"><div><p>Un regalo que florece al anochecer</p><h1>Flores Daniela</h1><div class="subtitle">Peonías y hortensias amarillas bajo un cielo de estrellas.</div></div></section>
    <button class="hint" type="button" aria-label="Iluminar el jardín">✦ Toca para iluminar el jardín</button><div class="glow"></div>
    <div class="field" aria-hidden="true">
      <div class="flower f1"><i class="stem"></i><i class="bloom"></i></div><div class="flower hydrangea f2"><i class="stem"></i><i class="bloom"></i></div><div class="flower f3"><i class="stem"></i><i class="bloom"></i></div><div class="flower hydrangea f4"><i class="stem"></i><i class="bloom"></i></div><div class="flower f5"><i class="stem"></i><i class="bloom"></i></div><div class="flower hydrangea f6"><i class="stem"></i><i class="bloom"></i></div><div class="flower f7"><i class="stem"></i><i class="bloom"></i></div><div class="flower hydrangea f8"><i class="stem"></i><i class="bloom"></i></div><div class="flower f9"><i class="stem"></i><i class="bloom"></i></div><div class="flower hydrangea f10"><i class="stem"></i><i class="bloom"></i></div><div class="flower f11"><i class="stem"></i><i class="bloom"></i></div><div class="flower hydrangea f12"><i class="stem"></i><i class="bloom"></i></div><div class="flower f13"><i class="stem"></i><i class="bloom"></i></div>
    </div>
  </main>
  <script>
    const hint = document.querySelector('.hint');
    hint.addEventListener('click', () => { document.querySelector('.glow').animate([{opacity:.2},{opacity:1},{opacity:.35}],{duration:1800,easing:'ease-out'}); hint.textContent='✦ El jardín está iluminado'; });
  </script>
</body>
</html>
