<div class="virtual-gift-viewport" [class.is-opened]="isOpened">

  <!-- ========================================== -->
  <!-- 1. LLUVIA DE PÉTALOS FLOTANTES DE FONDO    -->
  <!-- ========================================== -->
  <div class="petals-canvas" aria-hidden="true">
    <!-- Pétalos continuos del entorno -->
    <div 
      *ngFor="let petal of petals; trackBy: trackByPetalId"
      class="falling-petal"
      [style.left.%]="petal.left"
      [style.animationDelay.s]="petal.delay"
      [style.animationDuration.s]="petal.duration"
      [style.width.px]="petal.size"
      [style.height.px]="petal.size * 1.25"
      [style.opacity]="petal.opacity"
    >
      <div 
        class="petal-sway"
        [style.animationDuration.s]="petal.swayDuration"
        [style.transform]="'rotate(' + petal.rotation + 'deg)'"
      >
        <!-- SVG Pétalo de Peonía (Curvo, amplio) -->
        <svg *ngIf="petal.type === 'peony'" viewBox="0 0 40 50" class="petal-svg">
          <defs>
            <linearGradient [id]="'bg-peony-grad-' + petal.id" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF59D" />
              <stop offset="45%" stop-color="#FDD835" />
              <stop offset="100%" stop-color="#F57F17" />
            </linearGradient>
          </defs>
          <path 
            d="M20 2 C32 2 40 18 36 34 C33 46 25 49 20 49 C15 49 7 46 4 34 C0 18 8 2 20 2 Z" 
            [attr.fill]="'url(#bg-peony-grad-' + petal.id + ')'"
            filter="drop-shadow(0 2px 4px rgba(217, 119, 6, 0.25))"
          />
        </svg>

        <!-- SVG Pétalo de Hortensia (Pequeño, doble lóbulo) -->
        <svg *ngIf="petal.type === 'hydrangea'" viewBox="0 0 30 36" class="petal-svg">
          <defs>
            <linearGradient [id]="'bg-hyd-grad-' + petal.id" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFDE7" />
              <stop offset="60%" stop-color="#FFEE58" />
              <stop offset="100%" stop-color="#FBC02D" />
            </linearGradient>
          </defs>
          <path 
            d="M15 3 C22 3 28 12 26 22 C24 30 18 34 15 34 C12 34 6 30 4 22 C2 12 8 3 15 3 Z" 
            [attr.fill]="'url(#bg-hyd-grad-' + petal.id + ')'"
            filter="drop-shadow(0 1px 3px rgba(245, 127, 23, 0.2))"
          />
        </svg>
      </div>
    </div>

    <!-- Pétalos de ráfaga al abrir el regalo -->
    <div 
      *ngFor="let burst of burstPetals; trackBy: trackByPetalId"
      class="burst-petal"
      [style.left.%]="burst.left"
      [style.animationDelay.s]="burst.delay"
      [style.animationDuration.s]="burst.duration"
      [style.width.px]="burst.size"
      [style.height.px]="burst.size * 1.3"
    >
      <div 
        class="petal-sway"
        [style.animationDuration.s]="burst.swayDuration"
        [style.transform]="'rotate(' + burst.rotation + 'deg)'"
      >
        <svg viewBox="0 0 40 50" class="petal-svg">
          <path 
            d="M20 2 C32 2 40 18 36 34 C33 46 25 49 20 49 C15 49 7 46 4 34 C0 18 8 2 20 2 Z" 
            fill="url(#gold-petal-gradient)"
            filter="drop-shadow(0 3px 6px rgba(245, 127, 23, 0.4))"
          />
        </svg>
      </div>
    </div>
  </div>

  <!-- Gradientes globales para vectores compartidos -->
  <svg width="0" height="0" class="svg-defs-carrier" aria-hidden="true">
    <defs>
      <!-- Gradiente oro para pétalos de ráfaga -->
      <linearGradient id="gold-petal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF9C4" />
        <stop offset="40%" stop-color="#FFEB3B" />
        <stop offset="85%" stop-color="#FBC02D" />
        <stop offset="100%" stop-color="#E65100" />
      </linearGradient>

      <!-- Gradientes para la Peonía -->
      <radialGradient id="peony-center-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFE082" />
        <stop offset="40%" stop-color="#FFB300" />
        <stop offset="90%" stop-color="#E65100" />
      </radialGradient>
      <linearGradient id="peony-petal-outer" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFDE7" />
        <stop offset="25%" stop-color="#FFF59D" />
        <stop offset="70%" stop-color="#FDD835" />
        <stop offset="100%" stop-color="#F57F17" />
      </linearGradient>
      <linearGradient id="peony-petal-mid" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF9C4" />
        <stop offset="50%" stop-color="#FFEE58" />
        <stop offset="100%" stop-color="#FBC02D" />
      </linearGradient>
      <linearGradient id="peony-petal-inner" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#F57F17" />
        <stop offset="50%" stop-color="#FDD835" />
        <stop offset="100%" stop-color="#FFFDE7" />
      </linearGradient>

      <!-- Gradientes para la Hortensia -->
      <linearGradient id="hydrangea-floret-1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFDE7" />
        <stop offset="60%" stop-color="#FFF176" />
        <stop offset="100%" stop-color="#FBC02D" />
      </linearGradient>
      <linearGradient id="hydrangea-floret-2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFF9C4" />
        <stop offset="55%" stop-color="#FFEE58" />
        <stop offset="100%" stop-color="#F57F17" />
      </linearGradient>
      <radialGradient id="hydrangea-depth" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFEE58" />
        <stop offset="70%" stop-color="#FBC02D" />
        <stop offset="100%" stop-color="#C47F00" />
      </radialGradient>

      <!-- Gradientes para las Hojas -->
      <linearGradient id="leaf-grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#81C784" />
        <stop offset="45%" stop-color="#388E3C" />
        <stop offset="100%" stop-color="#1B5E20" />
      </linearGradient>
      <linearGradient id="leaf-grad-accent" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#A5D6A7" />
        <stop offset="50%" stop-color="#4CAF50" />
        <stop offset="100%" stop-color="#2E7D32" />
      </linearGradient>
      <linearGradient id="leaf-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2E7D32" />
        <stop offset="100%" stop-color="#0D3813" />
      </linearGradient>

      <!-- Gradientes para la Caja y Cinta de Regalo -->
      <linearGradient id="gold-ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFE082" />
        <stop offset="25%" stop-color="#FFD54F" />
        <stop offset="50%" stop-color="#FFCA28" />
        <stop offset="75%" stop-color="#FFB300" />
        <stop offset="100%" stop-color="#FFA000" />
      </linearGradient>
      <linearGradient id="gold-ribbon-shine" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFF9C4" />
        <stop offset="50%" stop-color="#FFD54F" />
        <stop offset="100%" stop-color="#FF8F00" />
      </linearGradient>
    </defs>
  </svg>

  <!-- ========================================== -->
  <!-- 2. ESCENA PRINCIPAL: CAJA DE REGALO Y RAMO -->
  <!-- ========================================== -->
  <main class="gift-scene">

    <!-- Indicador de interacción -->
    <div class="scene-header" [class.hidden]="isOpened">
      <div class="tap-hint">
        <span class="hint-sparkle">✨</span>
        <span class="hint-text">¡Toca la caja para abrir tu regalo!</span>
        <span class="hint-sparkle">✨</span>
      </div>
    </div>

    <!-- Contenedor general del regalo -->
    <div 
      class="gift-box-wrapper" 
      [class.opened]="isOpened" 
      (click)="openGift()"
      role="button"
      [attr.aria-label]="isOpened ? 'Caja de regalo abierta' : 'Abrir regalo virtual'"
      tabindex="0"
      (keydown.enter)="openGift()"
      (keydown.space)="openGift()"
    >
      <!-- Halo de resplandor mágico interior al abrir -->
      <div class="radiance-burst" aria-hidden="true"></div>

      <!-- Partículas de destellos mágicos -->
      <div class="sparkles-container" *ngIf="isOpened" aria-hidden="true">
        <div 
          *ngFor="let s of sparkles" 
          class="magic-sparkle"
          [style.left.%]="s.x"
          [style.top.%]="s.y"
          [style.width.px]="s.size"
          [style.height.px]="s.size"
          [style.animationDelay.s]="s.delay"
        >
          ✦
        </div>
      </div>

      <!-- ========================================== -->
      <!-- 3. RAMO ABUNDANTE (FLORES Y HOJAS)         -->
      <!-- ========================================== -->
      <div class="bouquet-stage" aria-hidden="true">
        <div class="bouquet-container">

          <!-- CAPA 0: Follaje y Hojas de fondo -->
          <div class="flower-layer layer-foliage">
            <!-- Hoja grande izquierda -->
            <div class="flower-item botanical-leaf leaf-left-far">
              <svg viewBox="0 0 70 140" class="flower-svg">
                <path d="M60 135 C55 95 10 70 5 15 C25 25 55 55 60 135 Z" fill="url(#leaf-grad-dark)" />
                <path d="M58 135 C50 90 20 65 15 25 C30 35 52 60 58 135 Z" fill="url(#leaf-grad-main)" />
                <!-- Nervaduras -->
                <path d="M58 135 Q40 85 15 25" stroke="#81C784" stroke-width="1.8" fill="none" />
                <path d="M45 105 Q30 95 24 88" stroke="#81C784" stroke-width="1.2" fill="none" opacity="0.8" />
                <path d="M36 85 Q22 75 16 68" stroke="#81C784" stroke-width="1.2" fill="none" opacity="0.8" />
              </svg>
            </div>

            <!-- Hoja grande derecha -->
            <div class="flower-item botanical-leaf leaf-right-far">
              <svg viewBox="0 0 70 140" class="flower-svg">
                <path d="M10 135 C15 95 60 70 65 15 C45 25 15 55 10 135 Z" fill="url(#leaf-grad-dark)" />
                <path d="M12 135 C20 90 50 65 55 25 C40 35 18 60 12 135 Z" fill="url(#leaf-grad-accent)" />
                <!-- Nervaduras -->
                <path d="M12 135 Q30 85 55 25" stroke="#C8E6C9" stroke-width="1.8" fill="none" />
                <path d="M25 105 Q40 95 46 88" stroke="#C8E6C9" stroke-width="1.2" fill="none" opacity="0.8" />
                <path d="M34 85 Q48 75 54 68" stroke="#C8E6C9" stroke-width="1.2" fill="none" opacity="0.8" />
              </svg>
            </div>

            <!-- Hoja alta central trasera -->
            <div class="flower-item botanical-leaf leaf-top-center">
              <svg viewBox="0 0 60 130" class="flower-svg">
                <path d="M30 130 C15 85 5 45 30 5 C55 45 45 85 30 130 Z" fill="url(#leaf-grad-main)" />
                <path d="M30 130 L30 5" stroke="#A5D6A7" stroke-width="1.8" />
                <path d="M30 90 Q18 80 12 72" stroke="#A5D6A7" stroke-width="1.2" opacity="0.75" />
                <path d="M30 90 Q42 80 48 72" stroke="#A5D6A7" stroke-width="1.2" opacity="0.75" />
                <path d="M30 65 Q20 56 16 50" stroke="#A5D6A7" stroke-width="1.2" opacity="0.75" />
                <path d="M30 65 Q40 56 44 50" stroke="#A5D6A7" stroke-width="1.2" opacity="0.75" />
              </svg>
            </div>
          </div>

          <!-- CAPA 1: Hortensias laterales y posteriores -->
          <div class="flower-layer layer-hydrangeas">

            <!-- Hortensia Izquierda -->
            <div class="flower-item hydrangea hydrangea-left">
              <svg viewBox="0 0 130 130" class="flower-svg">
                <!-- Base esférica de sombra volumétrica -->
                <circle cx="65" cy="65" r="50" fill="url(#hydrangea-depth)" opacity="0.35" />
                
                <!-- Agrupaciones de ramilletes de 4 pétalos (flósculos) -->
                <!-- Grupo fondo -->
                <g opacity="0.9" fill="url(#hydrangea-floret-2)">
                  <g transform="translate(35, 40) rotate(12)">
                    <ellipse cx="0" cy="-7" rx="5.5" ry="8" />
                    <ellipse cx="7" cy="0" rx="8" ry="5.5" />
                    <ellipse cx="0" cy="7" rx="5.5" ry="8" />
                    <ellipse cx="-7" cy="0" rx="8" ry="5.5" />
                    <circle cx="0" cy="0" r="2.2" fill="#E65100" />
                  </g>
                  <g transform="translate(65, 30) rotate(-20)">
                    <ellipse cx="0" cy="-7" rx="5.5" ry="8" />
                    <ellipse cx="7" cy="0" rx="8" ry="5.5" />
                    <ellipse cx="0" cy="7" rx="5.5" ry="8" />
                    <ellipse cx="-7" cy="0" rx="8" ry="5.5" />
                    <circle cx="0" cy="0" r="2.2" fill="#F57F17" />
                  </g>
                  <g transform="translate(95, 42) rotate(35)">
                    <ellipse cx="0" cy="-7" rx="5.5" ry="8" />
                    <ellipse cx="7" cy="0" rx="8" ry="5.5" />
                    <ellipse cx="0" cy="7" rx="5.5" ry="8" />
                    <ellipse cx="-7" cy="0" rx="8" ry="5.5" />
                    <circle cx="0" cy="0" r="2.2" fill="#E65100" />
                  </g>
                </g>

                <!-- Grupo medio -->
                <g fill="url(#hydrangea-floret-1)">
                  <g transform="translate(25, 68) rotate(45)">
                    <ellipse cx="0" cy="-8" rx="6" ry="9" />
                    <ellipse cx="8" cy="0" rx="9" ry="6" />
                    <ellipse cx="0" cy="8" rx="6" ry="9" />
                    <ellipse cx="-8" cy="0" rx="9" ry="6" />
                    <circle cx="0" cy="0" r="2.4" fill="#F57F17" />
                  </g>
                  <g transform="translate(52, 58) rotate(5)">
                    <ellipse cx="0" cy="-8.5" rx="6.5" ry="9.5" />
                    <ellipse cx="8.5" cy="0" rx="9.5" ry="6.5" />
                    <ellipse cx="0" cy="8.5" rx="6.5" ry="9.5" />
                    <ellipse cx="-8.5" cy="0" rx="9.5" ry="6.5" />
                    <circle cx="0" cy="0" r="2.5" fill="#E65100" />
                  </g>
                  <g transform="translate(80, 56) rotate(-15)">
                    <ellipse cx="0" cy="-8" rx="6.2" ry="9" />
                    <ellipse cx="8" cy="0" rx="9" ry="6.2" />
                    <ellipse cx="0" cy="8" rx="6.2" ry="9" />
                    <ellipse cx="-8" cy="0" rx="9" ry="6.2" />
                    <circle cx="0" cy="0" r="2.3" fill="#E65100" />
                  </g>
                  <g transform="translate(105, 68) rotate(22)">
                    <ellipse cx="0" cy="-7.5" rx="5.8" ry="8.5" />
                    <ellipse cx="7.5" cy="0" rx="8.5" ry="5.8" />
                    <ellipse cx="0" cy="7.5" rx="5.8" ry="8.5" />
                    <ellipse cx="-7.5" cy="0" rx="8.5" ry="5.8" />
                    <circle cx="0" cy="0" r="2.2" fill="#F57F17" />
                  </g>
                </g>

                <!-- Grupo frontal y superior más iluminado -->
                <g fill="url(#hydrangea-floret-1)" filter="drop-shadow(0 2px 3px rgba(196, 127, 0, 0.2))">
                  <g transform="translate(62, 80) rotate(18)">
                    <ellipse cx="0" cy="-9" rx="7" ry="10" />
                    <ellipse cx="9" cy="0" rx="10" ry="7" />
                    <ellipse cx="0" cy="9" rx="7" ry="10" />
                    <ellipse cx="-9" cy="0" rx="10" ry="7" />
                    <circle cx="0" cy="0" r="2.8" fill="#FFF9C4" />
                  </g>
                  <g transform="translate(38, 92) rotate(-30)">
                    <ellipse cx="0" cy="-8" rx="6" ry="9" />
                    <ellipse cx="8" cy="0" rx="9" ry="6" />
                    <ellipse cx="0" cy="8" rx="6" ry="9" />
                    <ellipse cx="-8" cy="0" rx="9" ry="6" />
                    <circle cx="0" cy="0" r="2.4" fill="#FFE082" />
                  </g>
                  <g transform="translate(88, 88) rotate(40)">
                    <ellipse cx="0" cy="-8" rx="6" ry="9" />
                    <ellipse cx="8" cy="0" rx="9" ry="6" />
                    <ellipse cx="0" cy="8" rx="6" ry="9" />
                    <ellipse cx="-8" cy="0" rx="9" ry="6" />
                    <circle cx="0" cy="0" r="2.4" fill="#FFE082" />
                  </g>
                </g>
              </svg>
            </div>

            <!-- Hortensia Derecha -->
            <div class="flower-item hydrangea hydrangea-right">
              <svg viewBox="0 0 130 130" class="flower-svg">
                <circle cx="65" cy="65" r="50" fill="url(#hydrangea-depth)" opacity="0.3" />
                
                <g opacity="0.95" fill="url(#hydrangea-floret-2)">
                  <g transform="translate(40, 36) rotate(-10)">
                    <ellipse cx="0" cy="-7" rx="5.5" ry="8" />
                    <ellipse cx="7" cy="0" rx="8" ry="5.5" />
                    <ellipse cx="0" cy="7" rx="5.5" ry="8" />
                    <ellipse cx="-7" cy="0" rx="8" ry="5.5" />
                    <circle cx="0" cy="0" r="2.2" fill="#E65100" />
                  </g>
                  <g transform="translate(70, 32) rotate(25)">
                    <ellipse cx="0" cy="-7" rx="5.5" ry="8" />
                    <ellipse cx="7" cy="0" rx="8" ry="5.5" />
                    <ellipse cx="0" cy="7" rx="5.5" ry="8" />
                    <ellipse cx="-7" cy="0" rx="8" ry="5.5" />
                    <circle cx="0" cy="0" r="2.2" fill="#F57F17" />
                  </g>
                  <g transform="translate(96, 44) rotate(-18)">
                    <ellipse cx="0" cy="-7" rx="5.5" ry="8" />
                    <ellipse cx="7" cy="0" rx="8" ry="5.5" />
                    <ellipse cx="0" cy="7" rx="5.5" ry="8" />
                    <ellipse cx="-7" cy="0" rx="8" ry="5.5" />
                    <circle cx="0" cy="0" r="2.2" fill="#E65100" />
                  </g>
                </g>

                <g fill="url(#hydrangea-floret-1)">
                  <g transform="translate(30, 65) rotate(30)">
                    <ellipse cx="0" cy="-8" rx="6" ry="9" />
                    <ellipse cx="8" cy="0" rx="9" ry="6" />
                    <ellipse cx="0" cy="8" rx="6" ry="9" />
                    <ellipse cx="-8" cy="0" rx="9" ry="6" />
                    <circle cx="0" cy="0" r="2.4" fill="#F57F17" />
                  </g>
                  <g transform="translate(58, 62) rotate(-8)">
                    <ellipse cx="0" cy="-8.5" rx="6.5" ry="9.5" />
                    <ellipse cx="8.5" cy="0" rx="9.5" ry="6.5" />
                    <ellipse cx="0" cy="8.5" rx="6.5" ry="9.5" />
                    <ellipse cx="-8.5" cy="0" rx="9.5" ry="6.5" />
                    <circle cx="0" cy="0" r="2.5" fill="#E65100" />
                  </g>
                  <g transform="translate(86, 60) rotate(15)">
                    <ellipse cx="0" cy="-8.2" rx="6.2" ry="9.2" />
                    <ellipse cx="8.2" cy="0" rx="9.2" ry="6.2" />
                    <ellipse cx="0" cy="8.2" rx="6.2" ry="9.2" />
                    <ellipse cx="-8.2" cy="0" rx="9.2" ry="6.2" />
                    <circle cx="0" cy="0" r="2.3" fill="#E65100" />
                  </g>
                  <g transform="translate(102, 72) rotate(-25)">
                    <ellipse cx="0" cy="-7.5" rx="5.8" ry="8.5" />
                    <ellipse cx="7.5" cy="0" rx="8.5" ry="5.8" />
                    <ellipse cx="0" cy="7.5" rx="5.8" ry="8.5" />
                    <ellipse cx="-7.5" cy="0" rx="8.5" ry="5.8" />
                    <circle cx="0" cy="0" r="2.2" fill="#F57F17" />
                  </g>
                </g>

                <g fill="url(#hydrangea-floret-1)" filter="drop-shadow(0 2px 3px rgba(196, 127, 0, 0.2))">
                  <g transform="translate(68, 86) rotate(12)">
                    <ellipse cx="0" cy="-9" rx="7" ry="10" />
                    <ellipse cx="9" cy="0" rx="10" ry="7" />
                    <ellipse cx="0" cy="9" rx="7" ry="10" />
                    <ellipse cx="-9" cy="0" rx="10" ry="7" />
                    <circle cx="0" cy="0" r="2.8" fill="#FFF9C4" />
                  </g>
                  <g transform="translate(42, 95) rotate(-15)">
                    <ellipse cx="0" cy="-8" rx="6" ry="9" />
                    <ellipse cx="8" cy="0" rx="9" ry="6" />
                    <ellipse cx="0" cy="8" rx="6" ry="9" />
                    <ellipse cx="-8" cy="0" rx="9" ry="6" />
                    <circle cx="0" cy="0" r="2.4" fill="#FFE082" />
                  </g>
                  <g transform="translate(94, 92) rotate(35)">
                    <ellipse cx="0" cy="-8" rx="6" ry="9" />
                    <ellipse cx="8" cy="0" rx="9" ry="6" />
                    <ellipse cx="0" cy="8" rx="6" ry="9" />
                    <ellipse cx="-8" cy="0" rx="9" ry="6" />
                    <circle cx="0" cy="0" r="2.4" fill="#FFE082" />
                  </g>
                </g>
              </svg>
            </div>

            <!-- Hortensia Superior Centro -->
            <div class="flower-item hydrangea hydrangea-top">
              <svg viewBox="0 0 110 110" class="flower-svg">
                <circle cx="55" cy="55" r="42" fill="url(#hydrangea-depth)" opacity="0.25" />
                <g fill="url(#hydrangea-floret-1)">
                  <g transform="translate(35, 35) rotate(10)">
                    <ellipse cx="0" cy="-6" rx="5" ry="7.5" />
                    <ellipse cx="6" cy="0" rx="7.5" ry="5" />
                    <ellipse cx="0" cy="6" rx="5" ry="7.5" />
                    <ellipse cx="-6" cy="0" rx="7.5" ry="5" />
                    <circle cx="0" cy="0" r="2" fill="#E65100" />
                  </g>
                  <g transform="translate(68, 32) rotate(-15)">
                    <ellipse cx="0" cy="-6" rx="5" ry="7.5" />
                    <ellipse cx="6" cy="0" rx="7.5" ry="5" />
                    <ellipse cx="0" cy="6" rx="5" ry="7.5" />
                    <ellipse cx="-6" cy="0" rx="7.5" ry="5" />
                    <circle cx="0" cy="0" r="2" fill="#F57F17" />
                  </g>
